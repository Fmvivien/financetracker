spring.application.name=financetracker

# MySQL Adatbázis Kapcsolati Beállítások
spring.datasource.url=jdbc:mysql://localhost:3306/financetracker?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:default_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
